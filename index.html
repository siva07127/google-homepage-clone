<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google Clone</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <nav>
        <a href="https://mail.google.com" target="_blank">Gmail</a>
        <a href="https://images.google.com" target="_blank">Images</a>

        <a href="https://myaccount.google.com" target="_blank" class="profile-link">
            <div class="profile">K</div>
        </a>
    </nav>
</header>

<main>

    <h1 class="logo">
        <span class="blue">G</span>
        <span class="red">o</span>
        <span class="yellow">o</span>
        <span class="blue">g</span>
        <span class="green">l</span>
        <span class="red">e</span>
    </h1>

    <form action="https://www.google.com/search" method="GET" target="_blank">

        <div class="search-box">
            <input
                type="text"
                name="q"
                placeholder="Search Google or type a URL"
                required>
        </div>

        <div class="buttons">
            <button type="submit">Google Search</button>

            <button
                type="button"
                onclick="window.open('https://www.google.com/doodles','_blank')">
                I'm Feeling Lucky
            </button>
        </div>

    </form>

</main>

<footer>

    <div class="footer-left">
        <a href="https://about.google/" target="_blank">About</a>
        <a href="https://ads.google.com/" target="_blank">Advertising</a>
        <a href="https://business.google.com/" target="_blank">Business</a>
    </div>

    <div class="footer-right">
        <a href="https://policies.google.com/privacy" target="_blank">Privacy</a>
        <a href="https://policies.google.com/terms" target="_blank">Terms</a>
        <a href="https://www.google.com/preferences" target="_blank">Settings</a>
    </div>

</footer>

</body>
</html>
